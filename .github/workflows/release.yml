name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

jobs:
  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: brew install mpv ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile translations
        run: python compile_translations.py || true

      - name: Build
        run: python build.py --clean --no-archive

      - name: Create archive
        run: |
          cd dist
          zip -r SubtitleToolkit-macos.zip SubtitleToolkit.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleToolkit-macos
          path: dist/SubtitleToolkit-macos.zip
          retention-days: 1

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libmpv-dev \
            libxcb-cursor0 libxcb-xinerama0 \
            libgl1 libegl1 \
            libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile translations
        run: python compile_translations.py || true

      - name: Build
        run: python build.py --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleToolkit-linux
          path: dist/SubtitleToolkit-linux.tar.gz
          retention-days: 1

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: choco install ffmpeg -y

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile translations
        run: python compile_translations.py
        continue-on-error: true

      - name: Build
        run: python build.py --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleToolkit-windows
          path: dist/SubtitleToolkit-windows.zip
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SubtitleToolkit ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/SubtitleToolkit-macos/SubtitleToolkit-macos.zip
            artifacts/SubtitleToolkit-linux/SubtitleToolkit-linux.tar.gz
            artifacts/SubtitleToolkit-windows/SubtitleToolkit-windows.zip
